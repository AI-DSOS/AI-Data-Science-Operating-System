site_name: AI Data Science Operating System (DSOS)
site_description: A single source of truth for a complete Data Science / ML / AI Engineering career transformation.
site_author: Arulkumaran

# docs_dir is the MkDocs default ("docs/"), used explicitly here rather than
# left implicit. This is a deliberate, tested decision, not an oversight:
# MkDocs does not allow docs_dir to be the same directory as mkdocs.yml
# itself (confirmed by testing — it errors with "docs_dir should not be the
# parent directory of the config file"), so the repo's other top-level
# folders (templates/, trackers/, prompts/, projects/, resources/, plus root
# README.md and AGENTS.md) cannot be included in this site without either
# duplicating content into docs/ or restructuring the repo's established
# top-level folder layout (set in Phase 1, referenced by hundreds of
# cross-links throughout the repo). Neither tradeoff was worth it, so the
# site is intentionally scoped to docs/ only. Full reasoning, and links out
# to everything else, are in docs/index.md and docs/documentation-site.md.
docs_dir: docs

=======
# docs_dir is repo root, not the MkDocs default ("docs/") — this repo's content
# spans multiple top-level folders (docs/, templates/, trackers/, prompts/,
# projects/, resources/, plus root README.md and AGENTS.md). This was missing
# in the Phase 1 version of this file, which would have failed to build since
# nav paths like "README.md" and "AGENTS.md" don't exist under the default
# docs/ directory. Fixed in Phase 9.
docs_dir: .
=======
